# ============================================================
# SIAKAD UMRAH - Docker Compose (Development Mode)
# Mode simpel: App + MySQL saja (tanpa Nginx/HTTPS)
# ============================================================

services:
  # Database
  db:
    image: mysql:8.0
    container_name: siakad-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: SiakadDBRoot@2026!Secure
      MYSQL_DATABASE: siakad_dbs
      MYSQL_USER: siakad_app
      MYSQL_PASSWORD: SiakadApp@2026!Strong
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    networks:
      - siakad-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pSiakadDBRoot@2026!Secure || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Aplikasi Node.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: siakad-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: siakad_app
      DB_PASSWORD: SiakadApp@2026!Strong
      DB_NAME: siakad_dbs
      SESSION_SECRET: siakad-docker-session-2026-pksj-umrah
      BCRYPT_SALT_ROUNDS: 12
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 200
      LOGIN_RATE_LIMIT_MAX: 5
      LOGIN_LOCKOUT_MINUTES: 15
      SESSION_MAX_AGE: 1800000
    ports:
      - "3000:3000"
    volumes:
      - app-logs:/app/logs
      - app-backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - siakad-net

volumes:
  mysql-data:
  app-logs:
  app-backups:

networks:
  siakad-net:
    driver: bridge

